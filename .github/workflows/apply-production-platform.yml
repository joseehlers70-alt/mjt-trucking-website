name: Apply production platform

on:
  push:
    branches:
      - codex/production-truck-sales-platform

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply, validate, and commit website source
        shell: bash
        run: |
          set -euo pipefail
          cat .codex-production-platform.part-* > /tmp/mjt-production-platform.zip
          unzip -t /tmp/mjt-production-platform.zip
          unzip -o /tmp/mjt-production-platform.zip
          rm -f .codex-production-platform.zip .codex-production-platform.part-*
          rm -f .github/workflows/apply-production-platform.yml
          rm -f src/components/AvailableVehicles.jsx
          rm -f src/components/WarehouseSection.jsx
          rm -f src/components/Contact.jsx
          rm -f src/data/vehicles.js
          rm -f src/data/gallery.js
          rm -f src/vehicles.css
          npm install
          npm run build
          rm -rf dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build production truck sales platform"
          git push origin HEAD:codex/production-truck-sales-platform
